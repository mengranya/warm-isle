<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efe4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="暖屿" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="暖屿 · 本地优先的 AI 角色扮演与开放世界沙盒工坊，包含独立的世界书、年份、回合状态与规则插件。"
    />
    <title>暖屿 · Warm Isle</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/views.css" />
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/sandbox.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
  </head>
  <body>
    <a class="skip-link" href="#view-root">跳到主要内容</a>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="侧边栏">
        <a class="brand" href="#/chat" aria-label="暖屿首页">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-sun"></span>
            <span class="brand-sea"></span>
          </span>
          <span class="brand-copy">
            <strong>暖屿</strong>
            <small>Warm Isle</small>
          </span>
        </a>

        <button class="new-archive-btn" id="new-archive-btn" type="button">
          <span class="plus" aria-hidden="true">+</span>
          <span id="new-archive-label">创建新存档</span>
        </button>

        <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>

        <section class="recent-dock" aria-labelledby="recent-title">
          <div class="recent-head">
            <h2 id="recent-title">最近的存档</h2>
            <a href="#/archives" class="text-link" id="recent-all-link">全部</a>
          </div>
          <div id="recent-archives" class="recent-list"></div>
        </section>

        <div class="sidebar-foot">
          <span class="privacy-dot" aria-hidden="true"></span>
          <span>数据只属于这台设备</span>
          <span class="version" id="app-version"></span>
        </div>
      </aside>

      <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="关闭菜单"></button>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-leading">
            <button
              class="icon-btn menu-btn"
              id="menu-btn"
              type="button"
              aria-label="打开菜单"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <span class="hamburger" aria-hidden="true"></span>
            </button>
            <div class="topbar-crumb">
              <span class="crumb-kicker" id="topbar-kicker">暖屿</span>
              <h1 id="topbar-title">我的存档</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <label class="model-quick" title="快速切换模型">
              <span class="sr-only">当前模型</span>
              <span class="model-quick-dot" id="quick-provider-dot" aria-hidden="true"></span>
              <select id="quick-model" aria-label="快速切换模型"></select>
            </label>
            <button class="status-pill" id="ai-status" type="button" title="查看模型连接设置">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="ai-status-text">检查中</span>
            </button>
            <button class="token-pill" id="token-hud" type="button" title="查看 token 统计">
              <span class="token-spark" aria-hidden="true">✦</span>
              <span id="token-hud-text">0 tokens</span>
            </button>
            <a class="icon-btn" href="#/settings" aria-label="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  d="M19.4 13.5c.1-.5.1-1 0-1.5l1.6-1.2-1.8-3.1-1.9.8c-.4-.3-.8-.6-1.3-.7L15.7 5h-3.6l-.3 2.8c-.5.1-.9.4-1.3.7l-1.9-.8L6.8 10.8 8.4 12c-.1.5-.1 1 0 1.5l-1.6 1.2 1.8 3.1 1.9-.8c.4.3.8.6 1.3.7l.3 2.8h3.6l.3-2.8c.5-.1.9-.4 1.3-.7l1.9.8 1.8-3.1-1.6-1.2Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <main class="view-root" id="view-root" tabindex="-1">
          <div class="boot-screen" role="status">
            <span class="boot-mark" aria-hidden="true"></span>
            <p>暖屿正在醒来…</p>
          </div>
        </main>
      </div>

      <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航"></nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

    <noscript>
      <p style="padding: 2rem; text-align: center">暖屿需要启用 JavaScript 才能运行。</p>
    </noscript>

    <script type="module" src="/js/mobile.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
